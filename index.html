<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage C 🛠 - Cyber Security Hub</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-amber: #ffb700;
            --bg-dark: #050b14;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(0, 243, 255, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.1) 0%, transparent 70%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #f8fafc;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .hud-header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        .hud-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .wrench-icon {
            display: inline-block;
            animation: spinWrench 6s linear infinite;
        }
        @keyframes spinWrench {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }
        .hud-sub {
            color: #94a3b8;
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .metric-icon { font-size: 20px; }
        .metric-info { display: flex; flex-direction: column; }
        .metric-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
        .metric-value { font-size: 13px; font-weight: bold; color: var(--neon-blue); }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-blue), transparent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #fff;
        }

        .photo-box {
            width: 100%;
            height: 230px;
            background-color: #020617;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed var(--border-color);
            position: relative;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .scanner-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
            animation: scanAnimation 3s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes scanAnimation {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        #log-container {
            font-family: "JetBrains Mono", "Courier New", monospace;
            background: #020617;
            padding: 14px;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 12px;
            color: var(--neon-blue);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="hud-header">
        <div class="hud-title">
            <span class="wrench-icon">🛠</span> GARAGE <span>C</span>
        </div>
        <div class="hud-sub">CYBERNETIC AUTOMATION & MONITORING</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <span class="metric-icon">🏎</span>
            <div class="metric-info">
                <span class="metric-label">Stato Box</span>
                <span class="metric-value">ATTIVO</span>
            </div>
        </div>
        <div class="metric-card">
            <span class="metric-icon">📡</span>
            <div class="metric-info">
                <span class="metric-label">Sensori</span>
                <span class="metric-value">ONLINE</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">📷 Scansione Ottica</h3>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--neon-blue);">
                <span class="pulse-dot"></span> LIVE
            </div>
        </div>
        <div class="photo-box" id="photo-box">
            <div class="scanner-line"></div>
            <span style="color: #64748b; font-size: 13px;">Nessuno scatto rilevato</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">📋 Registro Telemetrico</h3>
            <span style="font-size: 11px; color: #64748b;">AUTO-SYNC</span>
        </div>
        <div id="log-container">Inizializzazione feed...</div>
    </div>

    <script>
        function caricaDati() {
            const cacheBuster = new Date().getTime();
            fetch(`./log_ingressi.txt?t=${cacheBuster}`)
                .then(res => {
                    if(!res.ok) throw new Error();
                    return res.text();
                })
                .then(text => {
                    document.getElementById("log-container").innerText = text;
                })
                .catch(() => {
                    document.getElementById("log-container").innerText = ">> Nessun evento registrato.";
                });

            const photoBox = document.getElementById("photo-box");
            const imgPath = `./ultima_foto.jpg?t=${cacheBuster}`;
            const img = new Image();
            img.src = imgPath;
            img.onload = function() {
                photoBox.innerHTML = `<div class="scanner-line"></div><img src="${imgPath}" alt="Ultimo Ingresso">`;
            };
            img.onerror = function() {
                photoBox.innerHTML = `<div class="scanner-line"></div><span style="color: #64748b; font-size: 13px;">Nessuna foto presente</span>`;
            };
        }

        window.onload = function() {
            caricaDati();
            setInterval(caricaDati, 5000);
        };
    </script>
</body>
</html>
