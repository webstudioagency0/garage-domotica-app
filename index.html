<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Security 🛡 - Garage C Edition</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* ===== INTRO GARAGE C - LUXURY ===== */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 1s ease, transform 1s cubic-bezier(.77,0,.175,1);
        }
        #intro-overlay.hide {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }
        /* Garage Door */
       .garage-door {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100%;
            background: repeating-linear-gradient(0deg, #1e293b 0px, #1e293b 40px, #334155 41px);
            z-index: 5;
            animation: doorOpen 1.2s 0.5s cubic-bezier(.7,0,.3,1) forwards;
        }
        @keyframes doorOpen { to { transform: translateY(-100%); } }

        /* Hexagon Grid */
       .hex-grid {
            position: absolute;
            top: -20%;
            width: 120%;
            height: 70%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            transform: perspective(800px) rotateX(45deg);
            opacity: 0.9;
        }
       .hex {
            width: 70px; height: 80px;
            background: #0f172a;
            clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
            border: 2px solid #1e293b;
            box-shadow: inset 0 0 0 1px #334155;
            transition: all 0.3s;
            position: relative;
        }
       .hex.on {
            background: #f8fafc;
            box-shadow: 0 0 15px #fff, 0 0 35px #38bdf8, inset 0 0 10px #fff;
            border-color: #38bdf8;
        }
       .hex::after {
            content: '';
            position: absolute;
            inset: 8px;
            clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
            background: inherit;
            filter: brightness(1.3);
        }

       .floor-reflection {
            position: absolute;
            bottom: 0;
            width: 100%; height: 45%;
            background: linear-gradient(to top, rgba(56,189,248,0.15), transparent),
                        linear-gradient(90deg, transparent 20%, rgba(255,255,255,0.05) 50%, transparent 80%);
        }
        /* Cars Silhouettes */
       .cars-container {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 15px;
            align-items: end;
            margin-top: 120px;
            transform: perspective(600px) rotateX(10deg);
        }
       .car {
            width: 160px; height: 65px;
            background: linear-gradient(to bottom, #e2e8f0 0%, #0f172a 60%);
            border-radius: 40px 40px 8px 8px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56,189,248,0.3);
            opacity: 0;
            transform: translateY(100px) scale(0.8);
            animation: carIn 0.8s cubic-bezier(.175,.885,.32,1.275) forwards;
        }
       .car:nth-child(1) { animation-delay: 1s; background: linear-gradient(to bottom, #ef4444 0%, #7f1d1d 70%); }
       .car:nth-child(2) { width: 190px; height: 75px; animation-delay: 1.2s; background: linear-gradient(to bottom, #f8fafc 0%, #334155 70%); border: 1px solid #38bdf8; }
       .car:nth-child(3) { animation-delay: 1.4s; background: linear-gradient(to bottom, #facc15 0%, #854d0e 70%); }
       .car::before { /* windshield */
            content: ''; position: absolute; top: 8px; left: 15%; right: 15%; height: 18px;
            background: linear-gradient(to bottom, #38bdf8, #020617); border-radius: 10px; opacity: 0.8;
        }
       .car::after { /* headlight glow */
            content: ''; position: absolute; bottom: -4px; left: 10px; right: 10px; height: 4px;
            background: #38bdf8; box-shadow: 0 0 15px #38bdf8; border-radius: 50%;
        }
        @keyframes carIn { to { opacity: 1; transform: translateY(0) scale(1); } }

       .garage-title {
            position: relative; z-index: 3;
            margin-top: 25px;
            font-size: 42px; font-weight: 900; letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #38bdf8, 0 0 40px #0ea5e9;
            opacity: 0;
            animation: titleIn 0.6s 2s forwards;
        }
       .garage-title span { color: #38bdf8; }
       .garage-sub { color: #94a3b8; letter-spacing: 4px; font-size: 12px; margin-top: 5px; opacity: 0; animation: titleIn 0.6s 2.3s forwards; }
        @keyframes titleIn { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform: translateY(0);} }

       .skip-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 10;
            background: rgba(255,255,255,0.1); border: 1px solid #334155; color: #94a3b8;
            padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(10px);
        }

        /* ===== APP ORIGINALE ===== */
        h1 { margin-bottom: 5px; font-size: 24px; text-align: center; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; text-align: center; }
       .card {
            background-color: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; box-sizing: border-box; border: 1px solid #334155;
        }
       .btn-refresh {
            background-color: #3b82f6; color: white; border: none; padding: 12px; width: 100%;
            border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 15px;
        }
       .photo-box { width: 100%; height: 240px; background-color: #0f172a; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed #475569; }
       .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        #log-container { font-family: monospace; background: #0f172a; padding: 12px; border-radius: 10px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; color: #38bdf8; border: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- INTRO LUSSO GARAGE C -->
    <div id="intro-overlay">
        <div class="garage-door"></div>
        <div class="hex-grid" id="hex-grid"></div>
        <div class="floor-reflection"></div>
        <div class="cars-container">
            <div class="car"></div>
            <div class="car"></div>
            <div class="car"></div>
        </div>
        <div class="garage-title">GARAGE <span>C</span></div>
        <div class="garage-sub">LUXURY EDITION // HONEYCOMB LIGHTS</div>
        <button class="skip-btn" onclick="chiudiIntro()">Salta Intro ✕</button>
    </div>

    <h1>Garage Security 🛡</h1>
    <p class="subtitle">Monitoraggio Passaggi & Rilevamento Presenze - Garage C</p>

    <button class="btn-refresh" onclick="caricaDati()">🔄 Aggiorna Ora</button>

    <div class="card">
        <h3>📷 Ultimo Scatto</h3>
        <div class="photo-box" id="photo-box">
            <span style="color: #64748b;">Nessuna foto ancora scattata</span>
        </div>
    </div>

    <div class="card">
        <h3>📋 Registro Passaggi</h3>
        <div id="log-container">Caricamento registro...</div>
    </div>

    <script>
        const REPO_OWNER = "webstudioagency0";
        const REPO_NAME = "garage-domotica-app";

        // --- GENERA GRIGLIA ESAGONALE ---
        const grid = document.getElementById('hex-grid');
        for(let i=0; i<32; i++){
            const h = document.createElement('div');
            h.className = 'hex';
            grid.appendChild(h);
        }

        // Animazione accensione progressiva
        const hexs = document.querySelectorAll('.hex');
        hexs.forEach((hex, i) => {
            setTimeout(() => hex.classList.add('on'), 600 + i * 70);
        });

        // Chiudi intro dopo 4.5s
        setTimeout(chiudiIntro, 4500);

        function chiudiIntro(){
            const intro = document.getElementById('intro-overlay');
            if(!intro.classList.contains('hide')){
                intro.classList.add('hide');
            }
        }

        window.onload = function() {
            caricaDati();
        };

        function caricaDati() {
            const timestamp = new Date().getTime();
            fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/log_ingressi.txt?t=${timestamp}`)
               .then(res => res.text())
               .then(text => {
                    document.getElementById("log-container").innerText = text;
                })
               .catch(() => {
                    document.getElementById("log-container").innerText = "Nessun passaggio registrato.";
                });

            const imgUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/ultima_foto.jpg?t=${timestamp}`;
            const img = new Image();
            img.src = imgUrl;
            img.onload = function() {
                document.getElementById("photo-box").innerHTML = `<img src="${imgUrl}" alt="Ultimo Ingresso">`;
            };
            img.onerror = function() {
                document.getElementById("photo-box").innerHTML = `<span style="color: #64748b;">Nessuna foto presente</span>`;
            };
        }
    </script>
</body>
</html>
