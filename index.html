<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage C 🛠 - Cyber Security Hub</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-gold: #ffb700;
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(0, 243, 255, 0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 243, 255, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #f8fafc;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #intro-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 1s ease, transform 1s cubic-bezier(.77,0,.175,1);
        }
        #intro-overlay.hide {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .garage-door {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                #0b1329 0px,
                #1e293b 12px,
                #0f172a 24px,
                #020617 25px
            );
            box-shadow: inset 0 -30px 60px rgba(0,0,0,0.95);
            border-bottom: 6px solid #38bdf8;
            z-index: 5;
            animation: doorOpenRealistic 1.8s 0.6s cubic-bezier(.65,0,.07,1) forwards;
        }
        @keyframes doorOpenRealistic {
            0% { transform: translateY(0%); }
            20% { transform: translateY(-3%); }
            100% { transform: translateY(-105%); }
        }

        .hex-grid {
            position: absolute;
            top: -15%;
            width: 130%;
            height: 60%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            transform: perspective(700px) rotateX(40deg);
            opacity: 0.95;
        }
        .hex {
            width: 65px; height: 75px;
            background: #090d16;
            clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
            border: 1px solid #1e293b;
            transition: all 0.4s ease-out;
            position: relative;
        }
        .hex.on {
            background: #ffffff;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--neon-blue), inset 0 0 10px #fff;
            border-color: var(--neon-blue);
        }

        .cars-container {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-top: 110px;
            transform: perspective(600px) rotateX(12deg);
        }
        .car {
            width: 145px; height: 60px;
            border-radius: 35px 35px 8px 8px;
            position: relative;
            box-shadow: 0 20px 30px rgba(0,0,0,0.95), 0 0 30px rgba(0,243,255,0.3);
            opacity: 0;
            transform: translateY(100px) scale(0.9);
            animation: carIn 0.9s cubic-bezier(.175,.885,.32,1.275) forwards;
        }
        .car::before, .car::after {
            content: '';
            position: absolute;
            bottom: 12px;
            width: 14px; height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 5px var(--neon-blue);
        }
        .car::before { left: 10px; }
        .car::after { right: 10px; }

        .car:nth-child(1) { animation-delay: 1.2s; background: linear-gradient(to bottom, #dc2626 0%, #450a0a 85%); }
        .car:nth-child(2) { width: 180px; height: 70px; animation-delay: 1.4s; background: linear-gradient(to bottom, #f8fafc 0%, #0f172a 85%); border: 1px solid var(--neon-blue); }
        .car:nth-child(3) { animation-delay: 1.6s; background: linear-gradient(to bottom, #eab308 0%, #713f12 85%); }
        @keyframes carIn { to { opacity: 1; transform: translateY(0) scale(1); } }

        .garage-title {
            position: relative; z-index: 3;
            margin-top: 25px;
            font-size: 38px; font-weight: 900; letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-blue);
            opacity: 0;
            animation: titleIn 0.6s 2.2s forwards;
            display: flex; align-items: center; gap: 12px;
        }
        .garage-sub { color: #94a3b8; letter-spacing: 4px; font-size: 11px; margin-top: 6px; opacity: 0; animation: titleIn 0.6s 2.4s forwards; }
        @keyframes titleIn { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform: translateY(0);} }

        .skip-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 10;
            background: rgba(15,23,42,0.8); border: 1px solid var(--border-color); color: var(--neon-blue);
            padding: 9px 18px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(5px);
        }

        .hud-header { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        .hud-title { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 0 12px var(--neon-blue); }
        .wrench-icon { display: inline-block; animation: spinWrench 8s linear infinite; filter: drop-shadow(0 0 8px var(--neon-blue)); }
        @keyframes spinWrench { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 440px; margin-bottom: 20px; }
        .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px); }
        .metric-info { display: flex; flex-direction: column; }
        .metric-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-size: 13px; font-weight: bold; color: var(--neon-blue); }

        .card {
            background: var(--card-bg); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); margin-bottom: 20px; box-sizing: border-box; backdrop-filter: blur(10px);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: 700; color: #fff; margin: 0; display: flex; align-items: center; gap: 8px; }

        .photo-box {
            width: 100%; height: 240px; background-color: #020617; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed var(--border-color); position: relative;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .scanner-line {
            position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--neon-blue);
            box-shadow: 0 0 12px var(--neon-blue); animation: scanAnimation 2.8s ease-in-out infinite; z-index: 2;
        }
        @keyframes scanAnimation { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        #log-container {
            font-family: "JetBrains Mono", monospace; background: #020617; padding: 14px; border-radius: 12px;
            max-height: 180px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; color: var(--neon-blue); border: 1px solid rgba(0, 243, 255, 0.2);
        }
        .pulse-dot { width: 8px; height: 8px; background-color: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 10px var(--neon-blue); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="garage-door"></div>
        <div class="hex-grid" id="hex-grid"></div>
        <div class="cars-container">
            <div class="car"></div>
            <div class="car"></div>
            <div class="car"></div>
        </div>
        <div class="garage-title"><span class="wrench-icon">🛠</span> GARAGE <span>C</span></div>
        <div class="garage-sub">LUXURY MECHATRONICS // AUTOMATION HUB</div>
        <button class="skip-btn" onclick="chiudiIntro()">Salta Intro ✕</button>
    </div>

    <div class="hud-header">
        <div class="hud-title"><span class="wrench-icon">🛠</span> GARAGE C</div>
        <div style="color: #94a3b8; font-size: 11px; letter-spacing: 3px;">CYBERNETIC MONITORING SYSTEM</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <span style="font-size:22px;">🏎</span>
            <div class="metric-info">
                <span class="metric-label">Stato Box</span>
                <span class="metric-value">ATTIVO</span>
            </div>
        </div>
        <div class="metric-card">
            <span style="font-size:22px;">📡</span>
            <div class="metric-info">
                <span class="metric-label">Sensori</span>
                <span class="metric-value">ONLINE</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">📷 Scansione Ottica</h3>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--neon-blue);">
                <span class="pulse-dot"></span> LIVE
            </div>
        </div>
        <div class="photo-box" id="photo-box">
            <div class="scanner-line"></div>
            <span style="color: #64748b; font-size: 13px;">Nessuno scatto rilevato</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">📋 Registro Telemetrico</h3>
            <span style="font-size: 11px; color: #64748b;">AUTO-SYNC</span>
        </div>
        <div id="log-container">Inizializzazione feed...</div>
    </div>

    <script>
        const grid = document.getElementById('hex-grid');
        for(let i=0; i<32; i++){
            const h = document.createElement('div');
            h.className = 'hex';
            grid.appendChild(h);
        }
        const hexs = document.querySelectorAll('.hex');
        hexs.forEach((hex, i) => {
            setTimeout(() => hex.classList.add('on'), 500 + i * 55);
        });
        setTimeout(chiudiIntro, 4800);

        function chiudiIntro(){
            const intro = document.getElementById('intro-overlay');
            if(intro && !intro.classList.contains('hide')){
                intro.classList.add('hide');
            }
        }

        function caricaDati() {
            const cacheBuster = new Date().getTime();
            fetch(`./log_ingressi.txt?t=${cacheBuster}`)
                .then(res => {
                    if(!res.ok) throw new Error();
                    return res.text();
                })
                .then(text => {
                    document.getElementById("log-container").innerText = text;
                })
                .catch(() => {
                    document.getElementById("log-container").innerText = ">> Nessun evento registrato.";
                });

            const photoBox = document.getElementById("photo-box");
            const imgPath = `./ultima_foto.jpg?t=${cacheBuster}`;
            const img = new Image();
            img.src = imgPath;
            img.onload = function() {
                photoBox.innerHTML = `<div class="scanner-line"></div><img src="${imgPath}" alt="Ultimo Ingresso">`;
            };
            img.onerror = function() {
                photoBox.innerHTML = `<div class="scanner-line"></div><span style="color: #64748b; font-size: 13px;">Nessuna foto presente</span>`;
            };
        }

        window.onload = function() {
            caricaDati();
            setInterval(caricaDati, 5000);
        };
    </script>
</body>
</html>
