<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage C 🛠 - Cyber Security Hub</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-amber: #ffb700;
            --bg-dark: #050b14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(0, 243, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* INTRO ANIMATA CON SERRANDA E AUTO */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 1s ease, transform 1s cubic-bezier(.77,0,.175,1);
        }
        #intro-overlay.hide {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }
        .garage-door {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100%;
            background: repeating-linear-gradient(0deg, #0f172a 0px, #0f172a 35px, #1e293b 36px, #0f172a 40px);
            box-shadow: inset 0 -20px 50px rgba(0,0,0,0.9);
            z-index: 5;
            animation: doorOpen 1.4s 0.6s cubic-bezier(.7,0,.3,1) forwards;
        }
        @keyframes doorOpen { to { transform: translateY(-100%); } }

        .hex-grid {
            position: absolute;
            top: -10%;
            width: 120%;
            height: 65%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            transform: perspective(600px) rotateX(35deg);
            opacity: 0.9;
        }
        .hex {
            width: 60px; height: 70px;
            background: #090d16;
            clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
            border: 1px solid #1e293b;
            transition: all 0.4s;
            position: relative;
        }
        .hex.on {
            background: #f8fafc;
            box-shadow: 0 0 15px #fff, 0 0 30px var(--neon-blue);
        }

        .cars-container {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-top: 100px;
            transform: perspective(500px) rotateX(15deg);
        }
        .car {
            width: 140px; height: 55px;
            border-radius: 30px 30px 6px 6px;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.9), 0 0 25px rgba(0,243,255,0.4);
            opacity: 0;
            transform: translateY(80px);
            animation: carIn 0.8s cubic-bezier(.175,.885,.32,1.275) forwards;
        }
        .car:nth-child(1) { animation-delay: 1.1s; background: linear-gradient(to bottom, #ef4444 0%, #450a0a 80%); }
        .car:nth-child(2) { width: 170px; height: 65px; animation-delay: 1.3s; background: linear-gradient(to bottom, #f8fafc 0%, #0f172a 80%); border: 1px solid var(--neon-blue); }
        .car:nth-child(3) { animation-delay: 1.5s; background: linear-gradient(to bottom, #eab308 0%, #713f12 80%); }
        @keyframes carIn { to { opacity: 1; transform: translateY(0); } }

        .garage-title {
            position: relative; z-index: 3;
            margin-top: 20px;
            font-size: 36px; font-weight: 900; letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-blue);
            opacity: 0;
            animation: titleIn 0.6s 2s forwards;
            display: flex; align-items: center; gap: 10px;
        }
        .garage-sub { color: #94a3b8; letter-spacing: 3px; font-size: 11px; margin-top: 5px; opacity: 0; animation: titleIn 0.6s 2.2s forwards; }
        @keyframes titleIn { from { opacity:0; transform: translateY(15px);} to { opacity:1; transform: translateY(0);} }

        .skip-btn {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #94a3b8;
            padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
        }

        /* LAYOUT DASHBOARD HUD */
        .hud-header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .hud-title { font-size: 26px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px var(--neon-blue); }
        .wrench-icon { display: inline-block; animation: spinWrench 6s linear infinite; }
        @keyframes spinWrench { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 440px; margin-bottom: 20px; }
        .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; }
        .metric-info { display: flex; flex-direction: column; }
        .metric-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
        .metric-value { font-size: 13px; font-weight: bold; color: var(--neon-blue); }

        .card {
            background: var(--card-bg); border-radius: 16px; padding: 20px; width: 100%; max-width: 440px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border: 1px solid var(--border-color); margin-bottom: 20px; box-sizing: border-box;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 15px; font-weight: 700; color: #fff; margin: 0; }

        .photo-box {
            width: 100%; height: 230px; background-color: #020617; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed var(--border-color); position: relative;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .scanner-line {
            position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue); animation: scanAnimation 3s ease-in-out infinite; z-index: 2;
        }
        @keyframes scanAnimation { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        #log-container {
            font-family: monospace; background: #020617; padding: 12px; border-radius: 10px;
            max-height: 180px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; color: var(--neon-blue); border: 1px solid rgba(0, 243, 255, 0.2);
        }
        .pulse-dot { width: 8px; height: 8px; background-color: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 8px var(--neon-blue); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="garage-door"></div>
        <div class="hex-grid" id="hex-grid"></div>
        <div class="cars-container">
            <div class="car"></div>
            <div class="car"></div>
            <div class="car"></div>
        </div>
        <div class="garage-title"><span class="wrench-icon">🛠</span> GARAGE <span>C</span></div>
        <div class="garage-sub">HONEYCOMB LIGHTING // AUTOMATION HUB</div>
        <button class="skip-btn" onclick="chiudiIntro()">Salta Intro ✕</button>
    </div>

    <div class="hud-header">
        <div class="hud-title"><span class="wrench-icon">🛠</span> GARAGE C</div>
        <div style="color: #94a3b8; font-size: 11px; letter-spacing: 2px;">CYBERNETIC MONITORING SYSTEM</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <span style="font-size:20px;">🏎</span>
            <div class="metric-info">
                <span class="metric-label">Stato Box</span>
                <span class="metric-value">ATTIVO</span>
            </div>
        </div>
        <div class="metric-card">
            <span style="font-size:20px;">📡</span>
            <div class="metric-info">
                <span class="metric-label">Sensori</span>
                <span class="metric-value">ONLINE</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">📷 Scansione Ottica</h3>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--neon-blue);">
                <span class="pulse-dot"></span> LIVE
            </div>
        </div>
        <div class="photo-box" id="photo-box">
            <div class="scanner-line"></div>
            <span style="color: #64748b; font-size: 13px;">Nessuno scatto rilevato</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">📋 Registro Telemetrico</h3>
            <span style="font-size: 11px; color: #64748b;">AUTO-SYNC</span>
        </div>
        <div id="log-container">Inizializzazione feed...</div>
    </div>

    <script>
        const grid = document.getElementById('hex-grid');
        for(let i=0; i<30; i++){
            const h = document.createElement('div');
            h.className = 'hex';
            grid.appendChild(h);
        }
        const hexs = document.querySelectorAll('.hex');
        hexs.forEach((hex, i) => {
            setTimeout(() => hex.classList.add('on'), 500 + i * 60);
        });
        setTimeout(chiudiIntro, 4500);

        function chiudiIntro(){
            const intro = document.getElementById('intro-overlay');
            if(intro && !intro.classList.contains('hide')){
                intro.classList.add('hide');
            }
        }

        function caricaDati() {
            const cacheBuster = new Date().getTime();
            fetch(`./log_ingressi.txt?t=${cacheBuster}`)
                .then(res => {
                    if(!res.ok) throw new Error();
                    return res.text();
                })
                .then(text => {
                    document.getElementById("log-container").innerText = text;
                })
                .catch(() => {
                    document.getElementById("log-container").innerText = ">> Nessun evento registrato.";
                });

            const photoBox = document.getElementById("photo-box");
            const imgPath = `./ultima_foto.jpg?t=${cacheBuster}`;
            const img = new Image();
            img.src = imgPath;
            img.onload = function() {
                photoBox.innerHTML = `<div class="scanner-line"></div><img src="${imgPath}" alt="Ultimo Ingresso">`;
            };
            img.onerror = function() {
                photoBox.innerHTML = `<div class="scanner-line"></div><span style="color: #64748b; font-size: 13px;">Nessuna foto presente</span>`;
            };
        }

        window.onload = function() {
            caricaDati();
            setInterval(caricaDati, 5000);
        };
    </script>
</body>
</html>
