<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Security 🛡️</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-align: center; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }
        .btn-refresh {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-refresh:active { background-color: #2563eb; }
        .photo-box {
            width: 100%;
            height: 240px;
            background-color: #0f172a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #475569;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #log-container {
            font-family: monospace;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
            color: #38bdf8;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <h1>Garage Security 🛡️</h1>
    <p class="subtitle">Monitoraggio Passaggi & Rilevamento Presenze</p>

    <button class="btn-refresh" onclick="caricaDati()">🔄 Aggiorna Ora</button>

    <!-- Ultima Foto Scattata -->
    <div class="card">
        <h3>📷 Ultimo Scatto</h3>
        <div class="photo-box" id="photo-box">
            <span style="color: #64748b;">Nessuna foto ancora scattata</span>
        </div>
    </div>

    <!-- Registro Passaggi -->
    <div class="card">
        <h3>📋 Registro Passaggi</h3>
        <div id="log-container">Caricamento registro...</div>
    </div>

    <script>
        const REPO_OWNER = "webstudioagency0";
        const REPO_NAME = "garage-domotica-app";

        window.onload = function() {
            caricaDati();
        };

        function caricaDati() {
            const timestamp = new Date().getTime();
            
            // 1. Carica Registro Testo
            fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/log_ingressi.txt?t=${timestamp}`)
                .then(res => res.text())
                .then(text => {
                    document.getElementById("log-container").innerText = text;
                })
                .catch(() => {
                    document.getElementById("log-container").innerText = "Nessun passaggio registrato.";
                });

            // 2. Carica Ultima Foto Scattata
            const imgUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/ultima_foto.jpg?t=${timestamp}`;
            const img = new Image();
            img.src = imgUrl;
            img.onload = function() {
                document.getElementById("photo-box").innerHTML = `<img src="${imgUrl}" alt="Ultimo Ingresso">`;
            };
            img.onerror = function() {
                document.getElementById("photo-box").innerHTML = `<span style="color: #64748b;">Nessuna foto presente</span>`;
            };
        }
    </script>
</body>
</html>
